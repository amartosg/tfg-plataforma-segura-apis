services:
  kong-database:
    image: postgres:15
    container_name: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpass
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  kong-migrations:
    image: kong:3.6
    container_name: kong-migrations
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_PASSWORD: kongadmin
    command: kong migrations bootstrap
    restart: on-failure

  kong:
    image: kong:3.6
    container_name: kong
    depends_on:
      - kong-database
      - kong-migrations
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8100:8100"
    restart: unless-stopped

  clientes-api:
    build:
      context: ./backend/ClientesApi
      dockerfile: Dockerfile
    container_name: clientes-api
    environment:
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__User: tfguser
      RabbitMq__Password: tfgpassword
      RabbitMq__QueueName: cliente-creado
    ports:
      - "8081:8080"
    depends_on:
      - rabbitmq
    restart: unless-stopped

  cuentas-api:
    build:
      context: ./backend/CuentasApi
      dockerfile: Dockerfile
    container_name: cuentas-api
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8082:8080"
    restart: unless-stopped
    
  cliente-creado-consumer:
    build:
      context: ./backend/ClienteCreadoConsumer
      dockerfile: Dockerfile
    container_name: cliente-creado-consumer
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__User: tfguser
      RabbitMq__Password: tfgpassword
      RabbitMq__QueueName: cliente-creado
    depends_on:
      - rabbitmq
    restart: unless-stopped
    
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: tfguser
      RABBITMQ_DEFAULT_PASS: tfgpassword
    restart: unless-stopped
volumes:
  kong-db-data: